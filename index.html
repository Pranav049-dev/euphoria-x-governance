<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Euphoria X – brand governance before you publish</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

  <style>
    /* ============ 1. THEME TOKENS ============ */
    :root {
      --bg: #f6f3ff;  --sf: rgba(255, 255, 255, .78);  --tx: #1b1534;  --mu: #6f6a8a;  --bd: rgba(120, 100, 200, .18);
      --ac: #7c3aed;  --ac2: #ec4899;  --onac: #ffffff;
      --grad: linear-gradient(135deg, var(--ac), var(--ac2));
      --hi: #c92a2a;  --me: #d9730d;  --lo: #2f9e44;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    :root[data-theme=dark] {
      --bg: #14161c;  --sf: #1e222b;  --tx: #eceff4;  --mu: #98a1b3;  --bd: #323846;
      --ac: #8b7bff;  --ac2: #ff6bd6;  --onac: #101828;
      --hi: #ff6b6b;  --me: #ffa94d;  --lo: #69db7c;
      color-scheme: dark;
    }
    :root[data-theme=ocean]  { --bg: #eaf4fb; --tx: #0b2540; --mu: #55708a; --bd: #cfe3f2; --ac: #0077b6; --ac2: #00d4c8; }
    :root[data-theme=sunset] { --bg: #fff3ea; --tx: #3a1f12; --mu: #8a6652; --bd: #f3d9c6; --ac: #e8590c; --ac2: #f7b500; }
    :root[data-theme=forest] { --bg: #eef6ee; --tx: #14301c; --mu: #5c7a64; --bd: #d2e5d4; --ac: #2f9e44; --ac2: #14b8a6; }

    /* ============ 2. BASE ============ */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.5 'Sora', system-ui, sans-serif;
    }
    h1 { margin: 0; font-size: 20px; }
    h3 { margin: 0 0 8px; font-size: 15px; }

    button, select, input, textarea {
      font: inherit;
      color: var(--tx);
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 6px 10px;
    }
    button { cursor: pointer; }
    textarea {
      width: 100%;
      min-height: max(220px, calc(100vh - 300px));
      resize: vertical;
    }

    /* ============ 3. LAYOUT ============ */
    .app  { display: grid; grid-template-columns: auto 1fr; }
    .main { min-width: 0; padding: 12px 18px; }
    .top  { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px; }

    /* ============ 4. SIDEBAR ============ */
    #sidebar {
      position: sticky; top: 0; align-self: start;
      width: 250px; height: 100vh;
      padding: 16px;
      overflow: hidden auto;
      background: var(--sf);
      border-right: 1px solid var(--bd);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .brand-icon { display: inline-block; font-size: 28px; }
    .small { font-size: 12px; color: var(--mu); }
    #toggle { margin-left: auto; padding: 2px 9px; font-size: 16px; }

    .section-label {
      margin: 16px 0 6px;
      font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--mu);
    }
    .setting { display: block; margin-top: 14px; }

    #nav { position: relative; display: flex; flex-direction: column; gap: 4px; }
    #nav-highlight {
      position: absolute; top: 0; left: 0; z-index: 0;
      width: 0; height: 0;
      background: var(--ac);
      border-radius: 10px;
      box-shadow: 0 6px 16px color-mix(in srgb, var(--ac) 40%, transparent);
    }
    .nav-item {
      position: relative; z-index: 1;
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 10px 12px;
      text-align: left;
      color: var(--tx);
      background: transparent;
      border: 0; border-radius: 10px;
    }
    .nav-item:hover        { background: color-mix(in srgb, var(--ac) 14%, transparent); }
    .nav-item.active       { color: var(--onac); font-weight: 600; }
    .nav-item.active:hover { background: transparent; }

    /* collapsed (icon-only) sidebar */
    #sidebar.collapsed { padding: 16px 8px; }
    .collapsed .label,
    .collapsed .section-label,
    .collapsed .setting,
    .collapsed .small,
    .collapsed .brand b { display: none; }
    .collapsed .brand    { flex-direction: column; }
    .collapsed #toggle   { margin: 0; }
    .collapsed .nav-item { justify-content: center; padding: 10px 0; }

    /* ============ 5. COMPONENTS ============ */
    .card {
      margin-bottom: 12px; padding: 14px;
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: var(--radius, 12px);
    }
    .note {
      margin-top: 8px; padding: 8px 10px;
      font-size: 12.5px; color: var(--mu);
      background: var(--sf);
      border: 1px dashed var(--bd);
      border-radius: 8px;
    }
    .finding {
      margin: 8px 0; padding: 8px 10px;
      background: var(--bg);
      border-left: 4px solid var(--me);
      border-radius: 0 8px 8px 0;
    }
    .finding.high { border-color: var(--hi); }
    .finding.low  { border-color: var(--lo); }
    #findings     { max-height: max(240px, calc(100vh - 170px)); overflow: auto; }

    .tag {
      margin-right: 4px; padding: 1px 7px;
      font-size: 11px; color: var(--mu);
      border: 1px solid var(--bd); border-radius: 99px;
    }
    mark { padding: 0 2px; color: #000; background: #ffe066; border-radius: 3px; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .status  { font-weight: 600; }

    .bar-row { display: grid; grid-template-columns: 110px 1fr 90px; gap: 8px; align-items: center; margin: 6px 0; }
    .bar     { height: 10px; background: var(--ac); border-radius: 5px; transform-origin: left; }

    body, .card, #sidebar, .finding, .note {
      transition: background-color .4s, color .4s, border-color .4s;
    }

    /* ============ 6. EUPHORIA SKIN ============ */
    body {
      background:
        radial-gradient(900px 500px at 85% -10%, color-mix(in srgb, var(--ac2) 22%, transparent), transparent),
        radial-gradient(800px 500px at -5% 105%, color-mix(in srgb, var(--ac) 20%, transparent), transparent),
        var(--bg);
      background-attachment: fixed;
    }
    h1 { font-size: 28px; letter-spacing: -.02em; }
    .gradient-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

    .card, #sidebar {
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 30px color-mix(in srgb, var(--ac) 10%, transparent);
    }
    .card { border-radius: var(--radius, 18px); }

    .logo-mark {
      display: grid; place-items: center;
      width: 38px; height: 38px;
      font-size: 20px; font-weight: 700; color: #fff;
      background: var(--grad);
      border-radius: 12px;
      box-shadow: 0 6px 18px color-mix(in srgb, var(--ac) 45%, transparent);
    }
    #nav-highlight, .bar { background: var(--grad); }
    button.primary {
      color: var(--onac); font-weight: 600;
      background: var(--grad);
      border: 0;
      box-shadow: 0 6px 16px color-mix(in srgb, var(--ac) 35%, transparent);
    }
    .score { font-weight: 600; }
    .orb { position: fixed; z-index: -1; border-radius: 50%; background: var(--grad); filter: blur(70px); opacity: .3; pointer-events: none; }

    /* ============ 7. RESPONSIVE ============ */
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      #sidebar { position: static; width: auto !important; height: auto; border-right: 0; border-bottom: 1px solid var(--bd); }
      #nav { flex-direction: row; overflow-x: auto; }
      .nav-item { width: auto; white-space: nowrap; }
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="orb" style="width:340px;height:340px;top:-80px;right:-60px"></div>
  <div class="orb" style="width:300px;height:300px;bottom:-90px;left:260px"></div>

  <div class="app">
    <aside id="sidebar"></aside>

    <div class="main">
      <header class="top">
        <div>
          <h1 class="gradient-text">Euphoria X</h1>
          <div class="small">Publish with confidence — every word, claim and colour on-brand.</div>
        </div>
        <label>
          Role:
          <select id="role" onchange="setRole(this.value)">
            <option>Creator</option>
            <option>Manager</option>
            <option>Authorised reviewer</option>
          </select>
        </label>
      </header>

      <div id="view"></div>

      <div class="note">
        🔒 Transparency: all checks run locally in your browser using the rules shown under “Guidelines.”
        No content is sent to any AI or external service. Suggestions are proposals only; a human decides every change.
      </div>
    </div>
  </div>

<script>
/* ============ 1. CONFIG ============ */
const SAMPLE =
  "Meet the NEW LumoraHub!!! It’s the world’s best smart speaker and we guarantee 100% satisfaction. " +
  "Enjoy a 20-hour battery for only $99 – our users love how cheap it is. " +
  "We utilize cutting-edge synergy to delight you.\n\n" +
  "![hero](hub.png)\nBackground: #ff00aa";

const APPROVED_COLOURS = ['#1d3557', '#f1faee', '#e63946', '#ffffff', '#8a8a8a', '#000000'];
const THEME_NAMES = { light: '✨ Euphoria', dark: '🌙 Midnight', ocean: '🌊 Aurora', sunset: '🌇 Solar', forest: '🌲 Mint' };
const NAV   = [['Review', '🔍'], ['Workflow', '🔄'], ['Insights', '📊'], ['Guidelines', '📘']];
const THEMES = [['light', '☀️ Light'], ['dark', '🌙 Dark'], ['ocean', '🌊 Ocean'], ['sunset', '🌇 Sunset'], ['forest', '🌲 Forest']];

/*
  Each rule: category, severity, the guideline it comes from, a regex pattern,
  an optional isOk(match) exception, an explanation, and an optional fix / hint.
*/
const RULES = [
  // --- Terminology ---
  { cat: 'Terminology', sev: 'med', guide: 'G2 · Terminology', pattern: /Lumora ?Hub/gi,
    isOk: (m) => m === 'Lumora Hub',
    why: 'Product names must be written as “Lumora Hub” (two words).',
    fix: () => 'Lumora Hub' },
  { cat: 'Terminology', sev: 'low', guide: 'G2 · Terminology', pattern: /\bcheap\b/gi,
    why: '“Cheap” undermines our premium positioning.',
    fix: () => 'affordable' },
  { cat: 'Terminology', sev: 'low', guide: 'G2 · Terminology', pattern: /\busers\b/gi,
    why: 'We call customers “members”.',
    fix: () => 'members' },
  { cat: 'Terminology', sev: 'low', guide: 'G2 · Terminology', pattern: /\butilize\b/gi,
    why: 'Prefer plain language over jargon.',
    fix: () => 'use' },

  // --- Tone ---
  { cat: 'Tone', sev: 'low', guide: 'G1 · Voice & tone', pattern: /\b(synergy|cutting-edge|revolutionary)\b/gi,
    why: 'Buzzwords conflict with our “warm, plain-spoken” voice.' },
  { cat: 'Tone', sev: 'low', guide: 'G1 · Voice & tone', pattern: /!{2,}/g,
    why: 'Use at most one exclamation mark; our voice is calm and confident.',
    fix: () => '!' },
  { cat: 'Tone', sev: 'low', guide: 'G1 · Voice & tone', pattern: /\b[A-Z]{3,}\b/g,
    isOk: (m) => ['USB', 'LED', 'FAQ', 'AI'].includes(m),
    why: 'ALL-CAPS reads as shouting.',
    fix: (m) => m[0] + m.slice(1).toLowerCase() },

  // --- Claims ---
  { cat: 'Claims', sev: 'high', guide: 'G3 · Claims policy', pattern: /world[’']s best|#1|best-in-class|revolutionary/gi,
    why: 'Superlatives need approved evidence; none is on file in Approved Claims.',
    hint: 'Describe a verifiable benefit instead, e.g. “designed for clear, room-filling sound.”' },
  { cat: 'Claims', sev: 'high', guide: 'G3 · Claims policy', pattern: /guarantee[sd]?[^.]*?100%[^.]*|100% (satisfaction|guaranteed)/gi,
    why: 'Absolute guarantees are not approved. Legal-approved wording: “30-day returns.”',
    fix: () => 'enjoy 30-day returns' },

  // --- Facts ---
  { cat: 'Facts', sev: 'high', guide: 'F1 · Spec sheet v4', pattern: /(\d+)[- ]hours?( of)? battery/gi,
    isOk: (m) => parseInt(m) === 12,
    why: 'Approved spec: 12-hour battery life.',
    fix: (m) => m.replace(/\d+/, '12') },
  { cat: 'Facts', sev: 'high', guide: 'F2 · Price list Q4', pattern: /\$(\d+)/g,
    isOk: (m) => m === '$149',
    why: 'Approved retail price is $149.',
    fix: () => '$149' },

  // --- Visual ---
  { cat: 'Visual', sev: 'med', guide: 'G6 · Palette', pattern: /#[0-9a-f]{6}\b/gi,
    isOk: (m) => APPROVED_COLOURS.includes(m.toLowerCase()),
    why: 'Colour is not in the approved palette (#1D3557, #F1FAEE, #E63946).',
    fix: () => '#1D3557' },

  // --- Accessibility ---
  { cat: 'Accessibility', sev: 'high', guide: 'G5 · Accessibility', pattern: /!\[\s*\]\([^)]*\)/g,
    why: 'Image has no alt text; screen-reader users miss it.',
    hint: 'Add a short description inside the brackets, e.g. ![Lumora Hub on a kitchen counter](hub.png).' },
  { cat: 'Accessibility', sev: 'med', guide: 'G5 · Accessibility', pattern: /!\[(hero|image|img|photo|pic)\]/gi,
    why: 'Alt text is generic and doesn’t describe the image.',
    hint: 'Describe what is shown and why it matters.' },
];

/* ============ 2. STATE ============ */
const state = {
  animations: true,
  tab: 'Review',
  role: 'Creator',
  format: 'Social post',
  text: SAMPLE,
  textColour: '#8a8a8a',
  background: '#ffffff',
  status: 'Draft',
  history: [],
  comments: [],
  dismissed: {},                         // key -> reason the creator kept the original
  stats: {                               // category -> [times flagged, times overridden]
    Claims: [14, 2], Terminology: [22, 3], Tone: [9, 5],
    Facts: [6, 0], Accessibility: [11, 1], Visual: [5, 3],
  },
  lastFindingCount: undefined,
  navReady: false,
};

/* ============ 3. HELPERS ============ */
const $  = (selector) => document.querySelector(selector);
const $$ = (selector) => document.querySelectorAll(selector);
const escapeHtml = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const latest = () => state.history[state.history.length - 1];

/* ============ 4. CHECKER ============ */
function luminance(hex) {
  const [r, g, b] = [1, 3, 5].map((i) => {
    const v = parseInt(hex.substr(i, 2), 16) / 255;
    return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

function contrastRatio(a, b) {
  const [x, y] = [luminance(a), luminance(b)];
  return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
}

function runChecks() {
  const findings = [];

  RULES.forEach((rule, index) => {
    for (const match of state.text.matchAll(rule.pattern)) {
      const text = match[0];
      const key = `${index}:${text}`;
      if (rule.isOk?.(text) || state.dismissed[key]) continue;

      findings.push({ key, rule, text, at: match.index, fix: rule.fix?.(text) ?? null, hint: rule.hint });
    }
  });

  if (state.format === 'Image / graphic') {
    const ratio = contrastRatio(state.textColour, state.background);
    if (ratio < 4.5) {
      findings.push({
        key: 'contrast', at: -1, fix: null,
        text: `${state.textColour} on ${state.background}`,
        hint: 'Darken the text colour, e.g. #1D3557.',
        rule: { cat: 'Accessibility', sev: 'high', guide: 'G5 · WCAG AA',
                why: `Text/background contrast is ${ratio.toFixed(1)}:1; minimum is 4.5:1.` },
      });
    }
  }
  return findings.sort((a, b) => a.at - b.at);
}

/* ============ 5. ACTIONS ============ */
function go(tab)        { state.tab = tab; draw(); }
function setRole(role)  { state.role = role; draw(); }
function setFormat(f)   { state.format = f; draw(); }

function onTextInput(value) {
  state.text = value;
  renderFindings();
}

function acceptFix(index) {
  const f = runChecks()[index];
  state.text = state.text.slice(0, f.at) + f.fix + state.text.slice(f.at + f.text.length);
  $('#editor').value = state.text;
  renderFindings();
}

function keepOriginal(index) {
  const f = runChecks()[index];
  const reason = prompt('Reason for keeping the original (recorded in the audit trail):');
  if (!reason) return;

  state.dismissed[f.key] = reason;
  if (state.stats[f.rule.cat]) state.stats[f.rule.cat][1]++;
  state.comments.push({ by: state.role, text: `Kept “${f.text}” (${f.rule.cat}): ${reason}` });
  renderFindings();
}

function submitForReview() {
  const findings = runChecks();
  findings.forEach((f) => state.stats[f.rule.cat][0]++);

  state.history.push({
    version: state.history.length + 1,
    by: state.role,
    text: state.text,
    open: findings.length,
    high: findings.filter((f) => f.rule.sev === 'high').length,
    time: new Date().toLocaleTimeString(),
  });
  state.status = 'In review';
  go('Workflow');
}

function decide(decision) {
  if (decision === 'Approved' && latest().high && state.role !== 'Authorised reviewer') {
    alert('Open high-severity issues: an Authorised reviewer must approve.');
    return;
  }
  state.status = decision;
  state.comments.push({ by: state.role, text: decision });
  draw();
}

function addComment() {
  state.comments.push({ by: state.role, text: $('#comment').value });
  draw();
}

function restoreVersion(index) {
  state.text = state.history[index].text;
  go('Review');
}

/* ============ 6. VIEWS ============ */
function viewReview() {
  const formats = ['Social post', 'Email', 'Web page', 'Image / graphic'];
  const colourPickers = state.format === 'Image / graphic' ? `
    <div class="actions">
      Text colour <input type="color" value="${state.textColour}" oninput="state.textColour = this.value; renderFindings()">
      Background  <input type="color" value="${state.background}" oninput="state.background = this.value; renderFindings()">
    </div>` : '';

  $('#view').innerHTML = `
    <div class="grid">
      <div class="card">
        <h3>Content</h3>
        <select onchange="setFormat(this.value)">
          ${formats.map((f) => `<option ${f === state.format ? 'selected' : ''}>${f}</option>`).join('')}
        </select>
        <textarea id="editor" style="margin-top:8px" oninput="onTextInput(this.value)">${escapeHtml(state.text)}</textarea>
        ${colourPickers}
        <div class="actions"><button class="primary" onclick="submitForReview()">Submit for review →</button></div>
      </div>

      <div class="card">
        <h3>Findings <span id="count" class="tag"></span> <span id="score" class="tag score"></span></h3>
        <div id="findings"></div>
      </div>
    </div>`;
}

function renderFindings() {
  const findings = runChecks();
  $('#count').textContent = `${findings.length} open`;

  // Brand score: start at 100, subtract by severity
  const penalty = { high: 18, med: 8, low: 3 };
  const score = Math.max(0, 100 - findings.reduce((sum, f) => sum + penalty[f.rule.sev], 0));
  $('#score').textContent = `Brand score ${score}`;
  $('#score').style.color = score >= 80 ? 'var(--lo)' : score >= 50 ? 'var(--me)' : 'var(--hi)';

  $('#findings').innerHTML = findings.length
    ? findings.map(findingCard).join('')
    : '<p>✅ No open issues. Ready to submit.</p>';

  animateFindings(findings.length);
}

function findingCard(f, index) {
  const severityClass = f.rule.sev === 'med' ? '' : f.rule.sev;
  return `
    <div class="finding ${severityClass}">
      <span class="tag">${f.rule.cat}</span>
      <span class="tag">${f.rule.sev}</span>
      <span class="tag">${f.rule.guide}</span><br>
      <mark>${escapeHtml(f.text)}</mark> — ${f.rule.why}
      ${f.hint ? `<br><i>Suggestion:</i> ${f.hint}` : ''}
      ${f.fix  ? `<br><i>Suggested replacement:</i> <b>${escapeHtml(f.fix)}</b>` : ''}
      <div class="actions">
        ${f.fix && f.at >= 0 ? `<button onclick="acceptFix(${index})">Accept fix</button>` : ''}
        <button onclick="keepOriginal(${index})">Keep original…</button>
      </div>
    </div>`;
}

function viewWorkflow() {
  const current = latest();
  const canDecide = state.role !== 'Creator' && state.status === 'In review';

  const summary = current
    ? `<p>Latest: v${current.version} · ${current.open} open issue(s), ${current.high} high severity</p>`
    : '<p>Nothing submitted yet. Go to Review and submit.</p>';

  const decisionPanel = canDecide ? `
    <div class="actions">
      <button class="primary" onclick="decide('Approved')">Approve</button>
      <button onclick="decide('Changes requested')">Request changes</button>
    </div>
    <div class="note">Rule: content with open high-severity issues (claims, facts, accessibility)
      can only be approved by an <b>Authorised reviewer</b>.</div>`
    : '<div class="note">Switch role to Manager or Authorised reviewer to decide.</div>';

  const activity = state.comments
    .map((c) => `<div class="finding low"><b>${c.by}</b>: ${escapeHtml(c.text)}</div>`)
    .join('') || '<p>No activity.</p>';

  const versions = state.history.map((h, i) => {
    const previous = state.history[i - 1];
    const delta = previous ? ` · ${Math.abs(h.text.length - previous.text.length)} chars changed vs v${i}` : '';
    return `
      <div class="finding low">
        <b>v${h.version}</b> · ${h.by} · ${h.time}<br>${h.open} open issue(s)${delta}
        <div class="actions"><button onclick="restoreVersion(${i})">Restore</button></div>
      </div>`;
  }).reverse().join('') || '<p>None yet.</p>';

  $('#view').innerHTML = `
    <div class="grid">
      <div class="card">
        <h3>Status: <span class="status">${state.status}</span></h3>
        ${summary}
        ${decisionPanel}
        <h3 style="margin-top:12px">Comments & audit trail</h3>
        ${activity}
        <div class="actions">
          <input id="comment" placeholder="Add comment">
          <button onclick="addComment()">Post</button>
        </div>
      </div>
      <div class="card"><h3>Revision history</h3>${versions}</div>
    </div>`;
}

function viewInsights() {
  const rows = Object.entries(state.stats).sort((a, b) => b[1][0] - a[1][0]);
  const max = rows[0][1][0];

  const bars = rows.map(([name, [flagged]]) => `
    <div class="bar-row">
      <span>${name}</span>
      <div class="bar" style="width:${(flagged / max) * 100}%"></div>
      <span class="count-up" data-n="${flagged}">${flagged} flagged</span>
    </div>`).join('');

  const unclear = rows
    .filter(([, [flagged, overridden]]) => overridden / flagged >= 0.3)
    .map(([name, [flagged, overridden]]) => `
      <div class="finding"><b>${name}</b>: ${overridden} of ${flagged} flags overridden
        (${Math.round((overridden / flagged) * 100)}%). Review wording and add examples.</div>`)
    .join('') || '<p>None.</p>';

  $('#view').innerHTML = `
    <div class="grid">
      <div class="card"><h3>Recurring issues (all submissions)</h3>${bars}</div>
      <div class="card">
        <h3>Where guidelines may be unclear</h3>
        <p class="small">High override rates suggest the rule is ambiguous or too strict.</p>
        ${unclear}
        <p><b>Top coaching topic:</b> ${rows[0][0]} errors are most frequent; consider a short team refresher.</p>
      </div>
    </div>`;
}

function viewGuidelines() {
  $('#view').innerHTML = `
    <div class="grid">
      <div class="card">
        <h3>Approved source material</h3>
        <ul>
          <li><b>G1 Voice:</b> warm, plain-spoken, one “!” max, no buzzwords</li>
          <li><b>G2 Terms:</b> “Lumora Hub”, “members”, “affordable”, “use”</li>
          <li><b>G3 Claims:</b> no superlatives or guarantees without evidence; “30-day returns” approved</li>
          <li><b>G5 Accessibility:</b> meaningful alt text, WCAG AA 4.5:1 contrast</li>
          <li><b>G6 Palette:</b> #1D3557, #F1FAEE, #E63946</li>
          <li><b>F1 Specs:</b> 12-hour battery · <b>F2 Price:</b> $149 · <b>F3 Warranty:</b> 2 years</li>
        </ul>
      </div>
      <div class="card">
        <h3>How findings are produced</h3>
        <p>Each rule links to the guideline or fact that triggered it, so every flag is explainable and auditable.
           In production, this layer is where an LLM or vision model would add nuance (tone drift, logo misuse,
           image review) behind the same human approval step, with disclosure shown to the creator.</p>
        <p><b>Confidentiality:</b> guidelines stay in the workspace; role-based access limits who can edit them.</p>
      </div>
    </div>`;
}

const VIEWS = { Review: viewReview, Workflow: viewWorkflow, Insights: viewInsights, Guidelines: viewGuidelines };

function draw() {
  updateNav();
  VIEWS[state.tab]();
  state.lastFindingCount = undefined;
  if (state.tab === 'Review') renderFindings();
  animateView();
}

/* ============ 7. SIDEBAR & THEME ============ */
function buildSidebar() {
  $('#sidebar').innerHTML = `
    <div class="brand">
      <span id="logo" class="logo-mark">X</span>
      <div><b class="gradient-text">Euphoria X</b><div class="small">Brand governance</div></div>
      <button id="toggle" onclick="toggleSidebar()" title="Collapse / expand sidebar">‹</button>
    </div>

    <div class="section-label">Navigate</div>
    <nav id="nav">
      <div id="nav-highlight"></div>
      ${NAV.map(([name, icon]) => `
        <button class="nav-item" data-tab="${name}" onclick="go('${name}')">
          <span>${icon}</span><span class="label">${name}</span>
        </button>`).join('')}
    </nav>

    <div class="section-label">Theme</div>
    <select id="theme" class="setting" style="width:100%" onchange="setTheme(this.value)">
      ${THEMES.map(([id]) => `<option value="${id}">${THEME_NAMES[id]}</option>`).join('')}
    </select>

    <div class="section-label">Accent colour</div>
    <input id="accent" class="setting" type="color" value="#3b5bdb" style="width:100%;height:34px;padding:2px;margin:0"
           oninput="document.documentElement.style.setProperty('--ac', this.value)">

    <div class="section-label">Text size <span id="font-size">15</span>px</div>
    <input class="setting" type="range" min="13" max="18" value="15" style="width:100%;margin:0"
           oninput="document.body.style.fontSize = this.value + 'px'; $('#font-size').textContent = this.value">

    <div class="section-label">Corner radius</div>
    <input class="setting" type="range" min="0" max="24" value="12" style="width:100%;margin:0"
           oninput="document.documentElement.style.setProperty('--radius', this.value + 'px')">

    <label class="setting">
      <input type="checkbox" ${state.animations ? 'checked' : ''} onchange="state.animations = this.checked"> Animations
    </label>`;
}

function setTheme(name, silent) {
  const root = document.documentElement;
  root.dataset.theme = name;
  root.style.removeProperty('--ac');                       // drop custom accent
  $('#accent').value = getComputedStyle(root).getPropertyValue('--ac').trim();
  $('#theme').value = name;

  if (state.animations && !silent) {
    anime({ targets: '#theme',    scale: [1, 1.06, 1], duration: 500 });
    anime({ targets: '#view .card', opacity: [0.3, 1], duration: 600, easing: 'easeOutQuad' });
  }
}

function toggleSidebar() {
  const sidebar = $('#sidebar');
  const collapse = !sidebar.classList.contains('collapsed');
  const width = collapse ? 64 : 250;

  sidebar.classList.toggle('collapsed', collapse);
  $('#toggle').textContent = collapse ? '›' : '‹';

  if (state.animations) {
    anime({ targets: sidebar, width, duration: 450, easing: 'easeInOutQuart', update: () => updateNav(true) });
  } else {
    sidebar.style.width = width + 'px';
    updateNav(true);
  }
}

/** Marks the active tab and slides the highlight pill behind it. */
function updateNav(instant) {
  const active = $(`.nav-item[data-tab="${state.tab}"]`);
  $$('.nav-item').forEach((item) => item.classList.toggle('active', item === active));

  const box = { left: active.offsetLeft, top: active.offsetTop, width: active.offsetWidth, height: active.offsetHeight };

  if (state.animations && state.navReady && !instant) {
    anime({ targets: '#nav-highlight', ...box, duration: 600, easing: 'easeOutExpo' });
  } else {
    Object.entries(box).forEach(([prop, value]) => ($('#nav-highlight').style[prop] = value + 'px'));
  }
  state.navReady = true;
}

/* ============ 8. ANIMATIONS (anime.js) ============ */
function animateView() {
  if (!state.animations) return;

  anime({ targets: '#view .card', opacity: [0, 1], translateY: [24, 0], scale: [0.97, 1],
          delay: anime.stagger(100), duration: 600, easing: 'easeOutCubic' });
  anime({ targets: '#view .finding, #view .bar-row', opacity: [0, 1], translateX: [-18, 0],
          delay: anime.stagger(50, { start: 250 }), duration: 450, easing: 'easeOutQuad' });
  anime({ targets: '#view .bar', scaleX: [0, 1],
          delay: anime.stagger(80, { start: 350 }), duration: 800, easing: 'easeOutExpo' });

  $$('.count-up').forEach((el) => {
    const counter = { n: 0 };
    anime({ targets: counter, n: +el.dataset.n, round: 1, duration: 1200, easing: 'easeOutExpo',
            update: () => { el.textContent = `${counter.n} flagged`; } });
  });
}

/** Re-animate findings only when their number changes (not on every keystroke). */
function animateFindings(count) {
  const unchanged = count === state.lastFindingCount;
  const firstRender = state.lastFindingCount === undefined;
  state.lastFindingCount = count;
  if (!state.animations || unchanged || firstRender) return;

  anime({ targets: '#findings .finding', opacity: [0, 1], translateX: [-16, 0],
          delay: anime.stagger(60), duration: 400, easing: 'easeOutQuad' });
  anime({ targets: '#count', scale: [1, 1.5, 1], duration: 400 });
}

function animateIntro() {
  anime({ targets: '.orb', translateX: () => anime.random(-80, 80), translateY: () => anime.random(-60, 60),
          scale: [1, 1.25], direction: 'alternate', loop: true, duration: 5000, easing: 'easeInOutSine' });
  anime({ targets: '#sidebar .brand, #sidebar .section-label, #sidebar .nav-item, #sidebar .setting',
          opacity: [0, 1], translateX: [-24, 0], delay: anime.stagger(40), duration: 600, easing: 'easeOutCubic' });
  anime({ targets: '.top', opacity: [0, 1], translateY: [-10, 0], duration: 500, easing: 'easeOutQuad' });
  anime({ targets: '#logo', translateY: [-3, 3], rotate: [-8, 8], direction: 'alternate',
          loop: true, duration: 1600, easing: 'easeInOutSine' });
}

/* ============ 9. INIT ============ */
if (typeof anime === 'undefined') state.animations = false;   // page still works without anime.js

buildSidebar();
setTheme('light', true);
draw();
if (state.animations) animateIntro();

window.addEventListener('resize', () => updateNav(true));

// Press feedback on every button
document.addEventListener('pointerdown', (e) => {
  const button = e.target.closest('button');
  if (button && state.animations) anime({ targets: button, scale: [1, 0.9, 1], duration: 350, easing: 'easeOutQuad' });
});

// Nudge inactive nav items on hover
document.addEventListener('mouseover', (e) => {
  const item = e.target.closest('.nav-item');
  if (item && state.animations && !item.classList.contains('active')) {
    anime({ targets: item, translateX: [0, 6, 0], duration: 350, easing: 'easeOutQuad' });
  }
});
</script>
</body>
</html>
